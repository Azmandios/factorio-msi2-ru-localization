[Mining-Space-Industries-II]
page_mission_name_MI_001_broken_lab=Центральный компьютер корабля был катапультирован во время аварийной последовательности и найден в рабочем состоянии. В нём хранятся важнейшие технологии, критичные для нашей долгосрочной цели — покинуть эту планету. Наш ближайший приоритет — отремонтировать лабораторию, используя указанные выше материалы. После восстановления мы сможем исследовать технологию [technology=laboratory] «Лаборатория», что откроет возможность строить новые исследовательские объекты.

page_mission_name_MI_002_broken_generator=Резервный полевой генератор корабля был повреждён при крушении. Ремонт с использованием перечисленных выше материалов восстановит минимальное энергоснабжение — достаточное для базовых операций выживания. Учтите: установка крайне хрупкая. Продолжительная работа в неблагоприятных условиях не гарантируется.

page_mission_name_MI_003_companion_droid=MSI разработала специализированного дрона-помощника для поддержки исследовательских операций. К сожалению, похоже, он застрял в одном из ближайших мест обломков. Из этой точки исходят различимые сигналы — возможно, движение. Если восстановить обломки с помощью нужных материалов, мы сможем вернуть нашего исследователя-компаньона.\n\nПримечание: если ваш дрон MSI будет уничтожен, замену можно изготовить на месте крушения корабля.

page_mission_name_MI_003_companion_synthetic=MSI выделила синтетика для помощи в работе корабля. Видимых останков не найдено — будем считать это хорошим знаком. Вероятно, он всё ещё заперт в одном из мест обломков. Из этой точки исходят слабые аудиосигналы — если провести ремонт с помощью нужных материалов, мы сможем вернуть нашего синтетика-компаньона.

page_mission_name_MI_004_repair_synthetic=Дэвид-синтетик уничтожен! Как вы могли это допустить?\nНужно его починить. Подведите рабочего дрона MSI [img=entity/msi_companion_droid_1] к обломкам Дэвида, чтобы он провёл ремонт. Возможно, его ещё удастся спасти. Жизненно важные компоненты, похоже, всё ещё работают.

page_mission_name_MI_010_machines_shipwreck=Эй! Что это? Падает ещё один обломок корабля! Возможно, там найдётся что-то полезное, если успеть добраться вовремя... Похоже, этот кусок нестабилен. Скорее! Возьмите нужные материалы, чтобы вскрыть грузовой отсек и забрать всё, что получится.

page_mission_name_MI_011_military_shipwreck=Смотрите! Радары нашли ещё обломки корабля! Похоже, это остатки военного отсека. Возможно, там есть что-то полезное, если успеть добраться вовремя... Кажется, он вот-вот взорвётся. Скорее! Возьмите нужные материалы, чтобы открыть грузовой отсек.

page_mission_name_M_science_packs=Там должен быть наш научный дрон! Идите к тому корабельному компьютеру и почините его. Вероятно, вы найдёте дрона с важным исследовательским пакетом. Защитите его и сопроводите обратно к нашему разбитому кораблю, чтобы мы извлекли технологию. И не забудьте нажаловаться корпорации, какой этот малыш медленный — я почти уверен, что они сделали это нарочно, а ужасная навигация — просто дополнительный бонус.\n\nСовет: клавиша CTRL+E подзывает дрона к вашей позиции.

page_mission_name_M_power=Это что, ещё одна энергоячейка корабля? Да! Отлично! В таких штуках обычно есть важная информация — нужно лишь подать на неё энергию, чтобы открыть двери и забрать всё, что внутри. Правда, она очень хрупкая: как-то раз я слишком сильно чихнул рядом с такой, и у неё перегорел индикатор. Наверное, стоит её беречь.

page_mission_name_M_transportation=Отлично, это транспортное средство MSI! Оно содержит важные данные о способах транспортировки. И, разумеется, нам нужно извлечь эту технологию. Доставьте машину к нашему разбитому кораблю для извлечения.\n\nОсторожнее с ней! MSI приняла крайние меры для защиты засекреченных данных и установила самоуничтожение на случай несанкционированного доступа. Будьте готовы избавиться от неё, как только данные будут извлечены.\n\nУчтите! Эта развалина едет только вперёд, заднего хода нет. И, конечно, это настоящий «искатель деревьев». Все деревья вы найдёте передним бампером, хотите вы того или нет. Посмотрим, сколько мы их «найдём» по пути назад с нашим драгоценным грузом.

page_mission_name_M_upgrades=Этот терминал содержит важные данные MSI, которые понадобятся для улучшения наших технологий. Подключите сюда зелёную цепь [img=item/green-wire] от обломков вашего корабля, чтобы открыть новую технологию.

page_mission_name_M_ultimate_techs=Доступ к этим консолям есть только у дронов MSI. Подведите туда [img=entity/msi_companion_droid_1]рабочего дрона MSI, и он вскроет всё, что спрятано внутри.

page_mission_name_M_production=Мы нашли ещё один обломок. Идите к той сломанной машине, почините её и подайте энергию, чтобы запустить протоколы извлечения в надежде открыть новую технологию.

page_mission_name_M_military=Что это во имя самого Факториона?! Оно двинулось — убейте его, убейте, УБЕЙТЕ ЕГО! Испытаем наше оружие на этой твари, чтобы потом разработать что-нибудь получше.

page_mission_name_M_space_rockets=MSI держит вас в жёстком графике: им нужны конкретные ресурсы, иначе они решат, что вы отработанный актив. Поэтому нужно отправить запрошенные предметы ракетой, как показано ниже.\n\nВажное замечание: если указаны планета и место (обозначены кнопкой камеры), ракету нужно запускать именно оттуда, так что придётся построить там ракетную шахту.

page_mission_name_M_unique_oil=У этих надёжных синтетиков куча полезных функций. Стоит испытать функцию анализа сырой нефти на том нефтяном месторождении — возможно, мы даже сможем начать перерабатывать эту штуку.\n\nОтведите [img=entity/msi_companion_synthetic_pistol_gunner_1]Дэвида-синтетика к тому месторождению. Он проанализирует нефть и найдёт лучший способ её переработки.

page_mission_name_M_unique_rocket_silo=Итак, мы только что получили от MSI координаты, где следует начать строить наши ракетные шахты. Это оптимальная точка планеты для запуска ракет в космос. Поэтому раскопки разрешено начинать только здесь.\n\nВНИМАНИЕ! Обязательно приведите [img=entity/msi_companion_synthetic_pistol_gunner_1]Дэвида на стройплощадку. Его знания помогут вдвое сократить стоимость и время строительства! За работу!

page_mission_name_M_unique_satellites=Для следующей миссии нужно нанести на карту большую часть поверхности планеты, запуская новые спутники. Когда у нас будет хорошая и стабильная спутниковая сеть, MSI сможет отслеживать всё, что захочет здесь найти.\n\nТак что за дело! Стройте и запускайте ракеты со [img=item/satellite]спутниками!

page_mission_name_M_unique_boss_maf-worm-boss-fire-shooter=Мне начинает нравиться эта планета. Поначалу пришлось привыкнуть, но, кажется, теперь мы устроились неплохо. Тихо и мирно...\n\nО. Боже. Мой. ЭТО ГИГАНТСКИЙ ОГНЕННЫЙ ШАР ЛЕТИТ ПРЯМО НА НАС?! ФАКТОРИОН, СПАСИ НАС! На нас напали!\n\nРадары показали, что атака идёт от огромного червя, стреляющего огнём. Мне за это совершенно точно недоплачивают. Нужно мобилизовать все силы, убить этого червя и устранить угрозу как можно скорее!

page_mission_name_M_unique_boss_msi-smoke-boss-spawner=С пугающей скоростью начинает темнеть. Нужно провести несколько тестов, чтобы убедиться, что это нормально для этой планеты.\n\nРезультаты не сходятся. Похоже, темнеет из-за растущего количества биологического дыма. Как дым может быть биологическим? Такими темпами планета окутается дымом, и мы окажемся в полной темноте!\n\nДальнейшие тесты показали, что эти пришельцы эволюционируют и делают это, чтобы атаковать нас в темноте и повреждать наши машины. Мы выяснили, что причина всего дыма — огромное существо, испускающее плотный чёрный дым, который затягивает атмосферу.\n\nНужно устранить источник этих выбросов! Это, возможно, и неполиткорректно, но уничтожить этого чёртова монстра нужно как можно быстрее.

page_mission_name_M_research_msi_protomolecule_scan=Нужно исследовать технологию [technology=msi_protomolecule_scan], чтобы откалибровать наши спутники и обнаруживать присутствие загадочной протомолекулы. После этого мы сможем начать анализ свойств неизвестной частицы и, надеюсь, лучше понять, с чем имеем дело.

page_mission_name_M_unique_msi_dorment_protomolecule=Вот она! Вечно прятаться от нас не выйдет! Наши спутники обнаружили присутствие загадочной протомолекулы. Пора начать анализ свойств этой неизвестной частицы. Отведём Дэвида-синтетика к только что найденному артефакту для более детального осмотра.

page_mission_name_M_research_msi_protomolecule_awaken=Чёрт возьми! Что во имя Факториона только что произошло? Этого Дэвида что, поглотила эта штука? Что происходит? И что это за создания нас атакуют? Они похожи на Дэвида! Его что, клонируют? Что происходит?!\n\nОсторожно, эта штука выглядит нестабильной. Нужно попытаться освободить из неё Дэвида...\n\nНужно понять, что случилось. Если исследовать [technology=msi_protomolecule_awaken] этот образец молекулы в лаборатории, мы, возможно, поймём, как справиться с этой угрозой.

page_mission_name_M_unique_kill_protomolecule_spawner=Эта штука крайне заразна и заражает всё, чего касается! Скорее! Нужно всё сжечь!!! Убейте заражённое гнездо, пока заражение не распространилось!

page_mission_name_M_unique_msi_protomolecule_spawner_boss=Мы его убили? Да? Нет? О-о-о нет! Похоже, эта тварь только что взмыла в небо! И переместилась в другое место. Смотрите! Вон она. Только теперь она выглядит куда больше. Нужно уничтожить её любой ценой! Снова! К бою!!

page_mission_name_M_research_msi_protomolecule_antidote_bomb=Итак, нам удалось уничтожить то огромное заражённое гнездо протомолекулы! Это хорошая новость. Плохая — заражение распространилось вокруг так быстро, что теперь эта дрянь повсюду! Нужно исследовать способ борьбы с заражением. Сосредоточимся на разработке биологического оружия, чтобы выжечь угрозу навсегда. Если запустить его бомбой в атмосферу, оно ударит по всем сразу. Нужно исследовать антидотную бомбу [img=item/msi_protomolecule_antidote_bomb] и запустить её ракетой!

page_mission_name_M_unique_launch_protomolecule_antidote_bomb=Пора очистить эту планету от протомолекулы! Нужно выпустить антидотную бомбу в атмосферу. Разработанное нами биологическое оружие уничтожит всю активность протомолекулы на планете.\n\nЗапустите бомбу [img=item/msi_protomolecule_antidote_bomb] из нашей ракетной шахты!
