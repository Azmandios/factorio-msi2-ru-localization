[Mining-Space-Industries-II]
page_Mining-Space-Industries-II_text_1=Вашу команду наняла корпорация Mining Space Industries (MSI) для выполнения приоритетной операции по добыче ресурсов на Наувисе — планете на дальней окраине исследованного космоса. Задача миссии ясна: захватить и извлечь ценные минеральные ресурсы для операций MSI. При заходе на посадку корабль пережил критический сбой систем, что привело к незапланированной жёсткой посадке. Хотя инцидент создал операционные трудности, миссия остаётся активной, и провал — неприемлемый исход. Оценка последствий показала обширные повреждения. Данные бортового самописца («чёрного ящика») указывают, что ИИ корабля обнаружил непосредственную угрозу и самостоятельно активировал протоколы аварийного катапультирования. Приоритет был отдан сохранению имущества, а безопасность экипажа рассматривалась как второстепенная мера — это решение будет передано на рассмотрение корпоративной комиссии MSI. Экипаж успешно эвакуировался в спасательных капсулах до разрушения корабля. Хотя большая часть оборудования была утрачена, предварительное сканирование показывает, что из обломков можно извлечь остаточную энергию. Первоочередная задача — развернуть временную базу и начать анализ обстановки, чтобы возобновить выполнение параметров миссии.

page_technologies_text_1=При крушении мы потеряли множество важных компонентов корабля. Из-за этого многие сохранённые технологии — ранее хранившиеся в бортовых системах — считаются утраченными. Нам нужно находить и исследовать места обломков, чтобы восстановить эти технологии. Утраченные технологии отображаются в конце дерева технологий с тёмным фоном.\n\nЭти технологии НЕЛЬЗЯ исследовать, пока они не будут открыты через определённые миссии или запущенные события.\n\nЛюбая заблокированная технология продолжит блокировать доступ к зависимым от неё технологиям ниже по дереву.

page_companion_units_text_1=MSI выделила вашей команде двух вспомогательных андроидов для поддержки на протяжении всей миссии: роботизированного дрона-помощника и синтетика-гуманоида. Этот интерфейс позволяет настраивать их поведение, рабочие роли и другие параметры.

page_message_board_text_1=Это командная доска сообщений. Любой инженер вашей команды имеет к ней доступ. Здесь можно оставлять сообщения, расставлять приоритеты миссий, распределять задачи и так далее...

page_missions_text_1=Здесь видны ваши миссии, а также выполненные и проваленные, отфильтрованные по разделам в левом меню.\n\nНажмите на миссию, чтобы увидеть её цели и награды, если они есть.\n\nМиссии важны для восстановления наших утраченных технологий.

page_current_missions_text_1=Здесь видны ваши активные миссии.\n\nНажмите на миссию, чтобы увидеть её цели и награды, если они есть.\n\nУчтите: одновременно может быть только 2 активные миссии каждого типа. Поэтому, даже если вы не хотите выполнять миссию из-за неинтересной технологии, её всё равно придётся сделать: если 2 миссии этого типа уже активны, новые такого типа появляться не будут, и это помешает открыть другие технологии.\n\nНапример, если у вас 2 активные военные миссии, третья военная не появится, пока вы не выполните предыдущие.

page_accomplished_missions_text_1=Здесь видны ваши выполненные миссии. Поздравляем!

page_failed_missions_text_1=Здесь видны ваши проваленные миссии. Если такая миссия должна была открыть технологию, она может появиться снова позже. В этот раз не подведите. :)
