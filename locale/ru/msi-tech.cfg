[technology-description]
msi_companion_droid_tech=Эта технология позволяет улучшать дрона-компаньона MSI. Он помогает добывать, чинить, строить и производить науку. Каждый уровень добавляет здоровье, сопротивления и другие способности.
msi_companion_synthetic_tech=Эта технология позволяет улучшать Дэвида-синтетика. Каждый уровень добавляет здоровье, сопротивления, урон и другие боевые способности. Дэвид — боец, и он может помочь на стройплощадке ракетной шахты.
msi_protomolecule_scan=Эта технология позволит нашим спутникам обнаруживать присутствие загадочной протомолекулы, чтобы мы могли начать анализ свойств этой неизвестной частицы.
msi_protomolecule_awaken=Это поможет нам понять, что случилось с Дэвидом и что это за образец молекулы, чтобы знать, как справиться с этой угрозой.
msi_rocket_delivery_requests=Вашу команду наняла MSI (Mining Space Industries) с одной целью: добывать минеральные богатства этой планеты! И, разумеется, каждый такой тяжёлый груз вы должны доставлять ракетой. Исследуйте эту технологию, чтобы узнать, что именно MSI ожидает получить.
msi_protomolecule_antidote_bomb=Это биологическое оружие достаточно эффективно, чтобы уничтожить всё заражение протомолекулой на планете. Бомбу нужно запустить в атмосферу из ракетной шахты.
