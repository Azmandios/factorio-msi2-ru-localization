[mod-setting-description]
msi-enemy-hp-multiplier=0.2 - 10
msi-enemy-damage-multiplier=0.5 - 10
msi-difficulty-level=1-нормально, 5-сложнее
msi-mission-distance-mp=0.5 - 5
msi-disable-camera-popup=Если включено, камеры не будут всплывать автоматически
msi_cargo_request_min=Минимальное количество контейнеров в каждом запросе на доставку ракетой (мин. 1, макс. 99)
msi_cargo_request_max=Максимальное количество контейнеров в каждом запросе на доставку ракетой (мин. 1, макс. 99)
msi-allow-missions-other-planets=Только для мода Space Exploration
msi-mission-grace-minutes=Минуты, в течение которых новая сущность миссии неуничтожима, чтобы враги не могли её разрушить до вашего прихода. Защита также снимается, как только вы взаимодействуете с ней. 0 отключает защиту
msi-less-missions=Если включено, меньше технологий будет заблокировано миссиями

[controls]
msi-special-key=Особая клавиша мода (позвать дронов)
